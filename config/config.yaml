# Central configuration for the Kampala urban-climate PhD project.
# Every script reads from here, so change parameters in one place only.

paths:
  data_root: "~/kampala-thesis-data"   # outside OneDrive; large rasters
  figures_root: "~/kampala-thesis-data/figures"   # outside OneDrive: it times out on large GIF writes

earth_engine:
  project: "thermal-classification"   # registered non-commercial (no Restricted Mode); EE asset root not yet created
  export_folder: "kampala_thesis"  # Google Drive folder for EE exports

study_area:
  # Core city: Kampala Capital City Authority (KCCA) district boundary.
  core_name: "Kampala"
  # Extended study area: core city + peri-urban growth frontier (Wakiso, Mukono fringe).
  # [west, south, east, north] in EPSG:4326.
  extended_bbox: [32.35, 0.10, 32.85, 0.55]
  crs: "EPSG:32636"                # UTM 36N, metric CRS for all exports
  centre: {lat: 0.3136, lon: 32.5811}

# Three-date design shared by Modules 1-3.
# Dry-season months only (Dec-Feb, Jun-Aug) to beat Kampala's cloud cover.
epochs:
  t1: {year: 2017, start: "2016-12-01", end: "2017-08-31"}
  t2: {year: 2021, start: "2020-12-01", end: "2021-08-31"}
  t3: {year: 2025, start: "2024-12-01", end: "2025-08-31"}
dry_season_months: [12, 1, 2, 6, 7, 8]

sentinel2:
  collection: "COPERNICUS/S2_SR_HARMONIZED"
  fallback_collection: "COPERNICUS/S2_HARMONIZED"  # L1C, used if L2A coverage is thin for t1
  cloud_score_plus: "GOOGLE/CLOUD_SCORE_PLUS/V1/S2_HARMONIZED"
  cs_threshold: 0.60   # keep pixels with cs_cdf >= threshold
  bands: ["B2", "B3", "B4", "B5", "B6", "B7", "B8", "B8A", "B11", "B12"]
  scale: 10

landsat:
  collections: ["LANDSAT/LC08/C02/T1_L2", "LANDSAT/LC09/C02/T1_L2"]
  scale: 30
  max_cloud: 70        # scene filter only; pixels are QA-masked
  pad_months: 12       # dry seasons of a 3-year window centred on each epoch

landcover_classes:   # Module 1 semantic classes
  1: built_dense
  2: built_sparse
  3: tree_cover
  4: grass_cropland
  5: bare_soil
  6: wetland
  7: water

cube:
  dem: "projects/sat-io/open-datasets/FABDEM"   # bare-earth (buildings/trees removed); CC BY-NC-SA
  dsm: "COPERNICUS/DEM/GLO30_2024_1"            # surface model, kept for comparison
  buildings_temporal: "GOOGLE/Research/open-buildings-temporal/v1"
  buildings_polygons: "GOOGLE/Research/open-buildings/v3/polygons"
  era5_land: "ECMWF/ERA5_LAND/HOURLY"
  wind_years: [2015, 2024]
