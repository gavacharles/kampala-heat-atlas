name: Refresh meteograms and site weather, deploy site
on:
  schedule:
    # off-peak minutes: GitHub delays or drops schedules at the top of the hour. Two slots so one
    # missed trigger still leaves the site refreshed before work starts (the run is safe to repeat).
    - cron: "23 2 * * *"       # 05:23 in Uganda
    - cron: "41 3 * * *"       # 06:41 in Uganda, backup
  push:
    branches: [main]
    paths: ["scripts/**", "docs/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: meteogram
jobs:
  # one job per region, in parallel (separate runners, so the forecast requests are spread out)
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [uganda, east-africa, gulf, west-africa, southern-africa]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas matplotlib pvlib pythermalcomfort pillow
      - run: python scripts/31_site_weather_all.py docs/site-weather --group ${{ matrix.group }}
      - name: Pack this region's site folders
        if: always()
        run: |
          cd docs/site-weather
          touch _built_${{ matrix.group }}.txt
          tar czf ../../site-${{ matrix.group }}.tgz --ignore-failed-read $(cat _built_${{ matrix.group }}.txt) climatology_*.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-${{ matrix.group }}
          path: site-${{ matrix.group }}.tgz
          retention-days: 2

  # put the regions together: national cards, map data, landing page; commit the record; deploy
  assemble:
    needs: sites
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas matplotlib pvlib pythermalcomfort pillow
      - run: python scripts/25_meteogram.py docs/figures
        continue-on-error: true      # a failed heat meteogram must not block site weather or the deploy
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: packs
          merge-multiple: true
      - name: Unpack the regions
        run: for f in packs/*.tgz; do tar xzf "$f" -C docs/site-weather; done
      - run: python scripts/31_site_weather_all.py docs/site-weather --assemble
      - run: python scripts/32_market_link.py docs/site-weather      # site and market briefs (weather + CiO costs)
        continue-on-error: true
      - name: Commit the record (text only; images are deployed, not committed)
        run: |
          git config user.name "meteogram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/figures/meteogram_latest.png docs/figures/meteogram_latest.csv docs/site-weather
          git diff --cached --quiet && exit 0
          git commit -m "Refresh meteograms and site weather record"
          # someone may have pushed while this ran: rebase onto it (our freshly generated files win) and retry
          for i in 1 2 3 4; do
            git push && exit 0
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; git reset --soft origin/main; git commit -m "Refresh meteograms and site weather record"; }
            sleep $((i * 5))
          done
          echo "push failed after retries" && exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
