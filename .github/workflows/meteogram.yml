name: Refresh Kampala meteogram
on:
  schedule:
    - cron: "0 3 * * *"        # 06:00 in Kampala, daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  meteogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas matplotlib pvlib pythermalcomfort
      - run: python scripts/25_meteogram.py docs/figures
      - name: Commit if changed
        run: |
          git config user.name "meteogram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/figures/meteogram_latest.png docs/figures/meteogram_latest.csv
          git diff --cached --quiet || (git commit -m "Refresh Kampala meteogram" && git push)
