name: Refresh Kampala meteograms and site weather record
on:
  schedule:
    - cron: "0 3 * * *"        # 06:00 in Kampala, daily
  workflow_dispatch:
permissions:
  contents: write
concurrency: meteogram
jobs:
  meteogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas matplotlib pvlib pythermalcomfort
      - run: python scripts/25_meteogram.py docs/figures
      # construction site weather: meteogram, site note, and the daily/monthly record (add more sites as extra lines)
      - run: python scripts/29_site_weather.py docs/site-weather --name "Central Kampala" --lat 0.3136 --lon 32.5811
      - name: Commit if changed
        run: |
          git config user.name "meteogram-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/figures/meteogram_latest.png docs/figures/meteogram_latest.csv docs/site-weather
          git diff --cached --quiet || (git commit -m "Refresh meteograms and site weather record" && git push)
